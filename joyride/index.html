<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tesla Joyride</title>
  <link rel="icon" href="../flappy-assets/image/car_idle.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
  <!-- build:css -->
  <link rel="stylesheet" href="style/styles.b4051e730ba4.css">
  <!-- /build:css -->
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
      }

      #container {
          position: absolute;
          width: 100%;
          height: 100%;
      }

      #debug {
          position: absolute;
          display: flex;
          top: 10px;
          left: 10px;
          gap: 10px;
          z-index: 1000;
          padding: 5px;
          border: 1px solid rgba(255, 255, 255, .24);
          border-radius: 4px;
          background: rgba(23, 26, 32, .9);
          color: #fff;
          font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: .12em;
          text-transform: uppercase;
          align-items: center;
          text-shadow: none;
          backdrop-filter: blur(8px);
      }

      #debug input {
          width: 20px;
          height: 20px;
          accent-color: #e82127;
      }

      #debug label {
          line-height: 20px;
      }
  </style>
</head>
<body>

<div id="debug">
  <input id="debugToggle" type="checkbox">
  <label for="debugToggle">Debug</label>
</div>

<div id="container"></div>

<!-- build:js -->
<script defer src="./script/app.c0a98bbd63f7.js"></script>
<!-- /build:js -->
</body>
</html>
